name: Taxonomy PR

on:
  pull_request:
    # labeled/unlabeled re-run the gate when a maintainer applies the label,
    # so the check flips green without needing a new push.
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - 'taxonomy/**'

permissions:
  contents: read

jobs:
  # A taxonomy PR merges only with the maintainer-applied 'taxonomy-addition'
  # label. Contributors cannot label their own fork PRs, so this is the
  # explicit human sign-off on every registry change — including that an MCP
  # tool really does what its capability says, which no check can verify.
  # Schema validation below still runs regardless, so contributors get
  # feedback immediately.
  label-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Require the taxonomy/ branch prefix
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            taxonomy/*) echo "branch prefix ok: $HEAD_REF" ;;
            *) echo "::error::Taxonomy PRs must come from a branch named taxonomy/<something> (got '$HEAD_REF')."; exit 1 ;;
          esac
      - name: Require the taxonomy-addition label
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          case ",$LABELS," in
            *,taxonomy-addition,*) echo "label present" ;;
            *) echo "::error::This PR changes taxonomy/ but does not carry the 'taxonomy-addition' label. A maintainer must apply it before merge."; exit 1 ;;
          esac

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run validate:taxonomy
      - run: >-
          npx vitest run
          src/__tests__/capabilities.test.ts
          src/__tests__/taxonomy.test.ts
          src/__tests__/mcps.test.ts
          src/__tests__/find.test.ts
          src/__tests__/validate-taxonomy.test.ts
          src/__tests__/guard.test.ts
          src/__tests__/gateway-eligibility.test.ts
          src/__tests__/snapshots.test.ts

      # Step summary rather than a PR comment: the token on a fork PR is
      # read-only, so the comment API would fail for outside contributors.
      - name: Summarize taxonomy changes
        if: always()
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          {
            echo "## Venue changes"
            echo
            echo "| File | Change | Name | Category | Capabilities |"
            echo "| --- | --- | --- | --- | --- |"
            git diff --name-status --diff-filter=AM "$BASE_SHA" HEAD -- taxonomy/venues \
              | while read -r change path; do
                  node -e '
                    const fs = require("node:fs");
                    const [file, change] = process.argv.slice(1);
                    let v = {};
                    try { v = JSON.parse(fs.readFileSync(file, "utf8")); } catch {}
                    const caps = Array.isArray(v.capabilities) ? v.capabilities.join(", ") : "";
                    console.log(`| ${file} | ${change === "A" ? "added" : "modified"} | ${v.name ?? "?"} | ${v.category ?? "?"} | ${caps} |`);
                  ' "$path" "$change"
                done
            echo
            echo "## Contracts the signer guard will allow"
            echo
            echo "| Venue file | Hash | Role | Label | Source |"
            echo "| --- | --- | --- | --- | --- |"
            git diff --name-only --diff-filter=AM "$BASE_SHA" HEAD -- taxonomy/venues \
              | while read -r path; do
                  node -e '
                    const fs = require("node:fs");
                    const file = process.argv[1];
                    let v = {};
                    try { v = JSON.parse(fs.readFileSync(file, "utf8")); } catch {}
                    for (const s of Array.isArray(v.scripts) ? v.scripts : []) {
                      console.log(`| ${file} | \`${s.hash}\` | ${s.role} | ${s.label} | ${s.source} |`);
                    }
                  ' "$path"
                done
            echo
            echo "## MCP changes"
            echo
            echo "| File | Change | Name | Publisher | Official | Tools (capability, effect) |"
            echo "| --- | --- | --- | --- | --- | --- |"
            git diff --name-status --diff-filter=AM "$BASE_SHA" HEAD -- taxonomy/mcps \
              | while read -r change path; do
                  node -e '
                    const fs = require("node:fs");
                    const [file, change] = process.argv.slice(1);
                    let m = {};
                    try { m = JSON.parse(fs.readFileSync(file, "utf8")); } catch {}
                    const tools = Array.isArray(m.tools)
                      ? m.tools.map((t) => `${t.name} (${t.capability}, ${t.effect})`).join("<br>")
                      : "";
                    console.log(`| ${file} | ${change === "A" ? "added" : "modified"} | ${m.name ?? "?"} | ${m.publisher ?? "?"} | ${m.official ?? "?"} | ${tools} |`);
                  ' "$path" "$change"
                done
            echo
            echo "## Tools agents will see through the gateway"
            echo
            echo "Exactly this text reaches agents. Read it for instructions aimed at the agent rather than the user."
            echo
            echo "| Snapshot | Tool | Description |"
            echo "| --- | --- | --- |"
            git diff --name-only --diff-filter=AM "$BASE_SHA" HEAD -- taxonomy/snapshots \
              | while read -r path; do
                  node -e '
                    const fs = require("node:fs");
                    const file = process.argv[1];
                    let s = {};
                    try { s = JSON.parse(fs.readFileSync(file, "utf8")); } catch {}
                    for (const t of Array.isArray(s.tools) ? s.tools : []) {
                      console.log(`| ${file} | ${t.name} | ${String(t.description).replace(/[|\n]/g, " ")} |`);
                    }
                  ' "$path"
                done
            if ! git diff --quiet "$BASE_SHA" HEAD -- taxonomy/capabilities.json; then
              echo
              echo "## Capability tree changed"
              echo
              echo '```diff'
              git diff "$BASE_SHA" HEAD -- taxonomy/capabilities.json | tail -n +5
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
