name: Keepalive

# Free-tier Render services sleep after idle. This keeps the directory itself warm;
# each provider keeps its own backend warm (bazaarswap-mcp's repo does BazaarSwap's),
# so this neutral repo favours no provider.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the MCP server
        run: |
          curl -s -m 30 -o /dev/null -w "mcp: %{http_code}\n" https://cardano-defi-mcp.onrender.com/health || true
